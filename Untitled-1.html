<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>멀티 타이머 (로컬 1파일)</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #121623;
      --text: #e9edf7;
      --muted: #a9b2c7;
      --line: rgba(255,255,255,.08);
      --accent: #60a5fa;
      --good: #4ade80;
      --bad: #fb7185;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --r: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 20% 0%, rgba(96,165,250,.18), transparent),
                  radial-gradient(900px 500px at 90% 20%, rgba(74,222,128,.12), transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: min(1400px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }

    .title h1 { margin: 0; font-size: 18px; }
    .title .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    button, input, textarea { font: inherit; color: inherit; }

    .btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
    .btn.primary { background: rgba(96,165,250,.18); border-color: rgba(96,165,250,.35); }
    .btn.danger { background: rgba(251,113,133,.14); border-color: rgba(251,113,133,.32); }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.03);
      padding: 7px 10px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 14px;
      min-height: 72vh;
    }

    .panel {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 240px;
    }

    .panel h2 {
      margin: 0;
      font-size: 15px;
    }

    .small { font-size: 12px; color: var(--muted); }

    .todo-input-row { display: flex; gap: 8px; }
    .input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.2);
      border-radius: 12px;
      padding: 9px 11px;
      outline: none;
    }

    .todo-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      overflow: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,.03);
    }

    .todo-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .todo-item.done {
      filter: saturate(.35) brightness(.72);
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #c8cfdf;
    }

    .timer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .timer-list {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .timer-row {
      display: grid;
      grid-template-columns: 1.2fr .6fr .6fr auto auto auto;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    }

    .timer-row.done { border-color: rgba(74,222,128,.5); box-shadow: 0 0 0 1px rgba(74,222,128,.2); }

    .timer-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timer-time { font-family: var(--mono); font-size: 18px; }
    .timer-duration { font-size: 12px; color: var(--muted); font-family: var(--mono); }

    .memo {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.2);
      border-radius: 12px;
      padding: 10px;
      line-height: 1.45;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(2,4,8,.74);
      backdrop-filter: blur(3px);
      z-index: 99;
    }
    .modal.open { display: flex; }

    .modal-card {
      width: min(460px, 100%);
      background: linear-gradient(180deg, rgba(18,22,35,.98), rgba(14,18,30,.98));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: 0 20px 46px rgba(0,0,0,.52);
      display: grid;
      gap: 10px;
    }

    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    @media (max-width: 1180px) {
      .layout { grid-template-columns: 1fr; }
      .timer-row { grid-template-columns: 1fr 1fr 1fr auto auto auto; }
      .memo { min-height: 220px; }
    }

    @media (max-width: 760px) {
      .timer-row { grid-template-columns: 1fr 1fr; }
      .timer-row .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>멀티 타이머</h1>
        <div class="sub">3분할 레이아웃 · 중앙 타이머 · 로컬 자동 저장</div>
      </div>
      <div class="toolbar">
        <label class="toggle" title="완료 시 브라우저 알림">
          <input id="notifyToggle" type="checkbox" /> 알림
        </label>
        <label class="toggle" title="완료 시 짧은 비프음">
          <input id="beepToggle" type="checkbox" checked /> 비프
        </label>
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">가져오기</button>
        <button class="btn danger" id="clearBtn">전체 삭제</button>
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>TODO</h2>
        <div class="small">체크 시 취소선 + 채도/명도 감소로 구분됩니다.</div>
        <div class="todo-input-row">
          <input id="todoInput" class="input" placeholder="할 일 입력" />
          <button id="addTodoBtn" class="btn primary">추가</button>
        </div>
        <ul id="todoList" class="todo-list"></ul>
      </section>

      <section class="panel">
        <div class="timer-head">
          <h2>타이머</h2>
          <button class="btn primary" id="openAddModalBtn">+ 타이머 추가</button>
        </div>
        <div class="small">1줄 표시: 이름, 남은시간, 설정시간, Start, Restart, Delete</div>
        <div id="timerList" class="timer-list"></div>
      </section>

      <section class="panel">
        <h2>텍스트 메모장</h2>
        <div class="small">자동 저장됩니다.</div>
        <textarea id="memoInput" class="memo" placeholder="자유롭게 메모하세요..."></textarea>
      </section>
    </div>
  </div>

  <div id="timerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin:0;">타이머 추가</h3>
      <div class="field">
        <label>타이머 이름</label>
        <input id="nameInput" class="input" placeholder="예: 실험 타이머" />
      </div>
      <div class="field-grid">
        <div class="field">
          <label>분</label>
          <input id="minInput" class="input" type="number" min="0" step="1" value="0" />
        </div>
        <div class="field">
          <label>초</label>
          <input id="secInput" class="input" type="number" min="0" step="1" value="30" />
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" id="closeModalBtn">닫기</button>
        <button class="btn primary" id="addTimerBtn">추가</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "multi_timer_app_v2";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    const uid = () => Math.random().toString(36).slice(2, 10) + "-" + Date.now().toString(36);
    const clamp = (n, min, max) => Math.max(min, Math.min(max, Number.isFinite(n) ? n : min));

    function formatMs(ms) {
      ms = Math.max(0, ms | 0);
      const totalSec = Math.ceil(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function beepOnce() {
      if (!state.settings.beepEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
        setTimeout(() => ctx.close(), 250);
      } catch {}
    }

    async function ensureNotificationPermission() {
      if (!("Notification" in window)) return false;
      if (Notification.permission === "granted") return true;
      if (Notification.permission === "denied") return false;
      try {
        return (await Notification.requestPermission()) === "granted";
      } catch {
        return false;
      }
    }

    async function notify(title, body) {
      if (!state.settings.notifyEnabled) return;
      const ok = await ensureNotificationPermission();
      if (!ok) return;
      try {
        new Notification(title, { body });
      } catch {}
    }

    const defaultState = {
      settings: {
        beepEnabled: true,
        notifyEnabled: false,
      },
      timers: [],
      todos: [],
      memo: "",
    };

    let state = { ...defaultState, ...(loadState() ?? {}) };
    if (!Array.isArray(state.timers)) state.timers = [];
    if (!Array.isArray(state.todos)) state.todos = [];
    if (typeof state.memo !== "string") state.memo = "";

    const timerListEl = document.getElementById("timerList");
    const todoListEl = document.getElementById("todoList");
    const todoInput = document.getElementById("todoInput");
    const addTodoBtn = document.getElementById("addTodoBtn");
    const memoInput = document.getElementById("memoInput");

    const nameInput = document.getElementById("nameInput");
    const minInput = document.getElementById("minInput");
    const secInput = document.getElementById("secInput");
    const addTimerBtn = document.getElementById("addTimerBtn");
    const timerModal = document.getElementById("timerModal");
    const openAddModalBtn = document.getElementById("openAddModalBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    const beepToggle = document.getElementById("beepToggle");
    const notifyToggle = document.getElementById("notifyToggle");
    const clearBtn = document.getElementById("clearBtn");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");

    beepToggle.checked = !!state.settings.beepEnabled;
    notifyToggle.checked = !!state.settings.notifyEnabled;
    memoInput.value = state.memo;

    function openModal() {
      timerModal.classList.add("open");
      setTimeout(() => nameInput.focus(), 10);
    }

    function closeModal() {
      timerModal.classList.remove("open");
    }

    function addTimer({ name, minutes, seconds }) {
      const durMs = (clamp(minutes, 0, 9999) * 60 + clamp(seconds, 0, 59)) * 1000;
      if (durMs <= 0) return;
      state.timers.unshift({
        id: uid(),
        name: (name ?? "").trim() || "Unnamed Timer",
        durationMs: durMs,
        remainingMs: durMs,
        running: false,
        done: false,
        lastTickTs: null,
        alerted: false,
      });
      saveState();
      renderTimers();
      closeModal();
      nameInput.value = "";
      minInput.value = "0";
      secInput.value = "30";
    }

    function removeTimer(id) {
      state.timers = state.timers.filter((t) => t.id !== id);
      saveState();
      renderTimers();
    }

    function startTimer(id) {
      const t = state.timers.find((x) => x.id === id);
      if (!t || t.done) return;
      t.running = !t.running;
      t.lastTickTs = t.running ? Date.now() : null;
      saveState();
      renderTimers();
    }

    function restartTimer(id) {
      const t = state.timers.find((x) => x.id === id);
      if (!t) return;
      t.remainingMs = t.durationMs;
      t.running = false;
      t.done = false;
      t.alerted = false;
      t.lastTickTs = null;
      saveState();
      renderTimers();
    }

    function tickOne(t) {
      if (!t.running || t.done) return;
      const now = Date.now();
      const last = t.lastTickTs ?? now;
      const dt = Math.max(0, now - last);
      t.lastTickTs = now;
      t.remainingMs -= dt;
      if (t.remainingMs <= 0) {
        t.remainingMs = 0;
        t.done = true;
        t.running = false;
        t.lastTickTs = null;
        if (!t.alerted) {
          t.alerted = true;
          beepOnce();
          notify("타이머 완료", t.name);
        }
      }
    }

    function tickAll() {
      let changed = false;
      for (const t of state.timers) {
        const prev = t.remainingMs;
        const prevDone = t.done;
        const prevRun = t.running;
        tickOne(t);
        if (prev !== t.remainingMs || prevDone !== t.done || prevRun !== t.running) changed = true;
      }
      if (changed) {
        saveState();
        renderTimers();
      }
    }

    function renderTimers() {
      timerListEl.innerHTML = "";
      for (const t of state.timers) {
        const row = document.createElement("div");
        row.className = "timer-row" + (t.done ? " done" : "");
        row.innerHTML = `
          <div class="timer-name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>
          <div class="timer-time">${formatMs(t.remainingMs)}</div>
          <div class="timer-duration">${formatMs(t.durationMs)}</div>
          <button class="btn startBtn">${t.running ? "Pause" : "Start"}</button>
          <button class="btn" data-act="restart">Restart</button>
          <button class="btn danger" data-act="delete">Delete</button>
        `;
        row.querySelector(".startBtn").addEventListener("click", () => startTimer(t.id));
        row.querySelector('[data-act="restart"]').addEventListener("click", () => restartTimer(t.id));
        row.querySelector('[data-act="delete"]').addEventListener("click", () => removeTimer(t.id));
        timerListEl.appendChild(row);
      }
    }

    function renderTodos() {
      todoListEl.innerHTML = "";
      for (const todo of state.todos) {
        const li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");
        li.innerHTML = `
          <label class="todo-main">
            <input type="checkbox" ${todo.done ? "checked" : ""} />
            <span class="todo-text">${escapeHtml(todo.text)}</span>
          </label>
          <button class="btn danger" style="padding:6px 9px;" title="삭제">삭제</button>
        `;
        li.querySelector('input[type="checkbox"]').addEventListener("change", (e) => {
          todo.done = e.target.checked;
          saveState();
          renderTodos();
        });
        li.querySelector("button").addEventListener("click", () => {
          state.todos = state.todos.filter((x) => x.id !== todo.id);
          saveState();
          renderTodos();
        });
        todoListEl.appendChild(li);
      }
    }

    function addTodo(text) {
      const v = (text ?? "").trim();
      if (!v) return;
      state.todos.unshift({ id: uid(), text: v, done: false });
      saveState();
      renderTodos();
      todoInput.value = "";
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    beepToggle.addEventListener("change", () => {
      state.settings.beepEnabled = beepToggle.checked;
      saveState();
    });

    notifyToggle.addEventListener("change", async () => {
      state.settings.notifyEnabled = notifyToggle.checked;
      saveState();
      if (notifyToggle.checked) await ensureNotificationPermission();
    });

    addTimerBtn.addEventListener("click", () => {
      addTimer({
        name: nameInput.value,
        minutes: Number(minInput.value || 0),
        seconds: Number(secInput.value || 0),
      });
    });

    [nameInput, minInput, secInput].forEach((el) => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addTimerBtn.click();
        if (e.key === "Escape") closeModal();
      });
    });

    openAddModalBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);
    timerModal.addEventListener("click", (e) => {
      if (e.target === timerModal) closeModal();
    });

    addTodoBtn.addEventListener("click", () => addTodo(todoInput.value));
    todoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodoBtn.click();
    });

    memoInput.addEventListener("input", () => {
      state.memo = memoInput.value;
      saveState();
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("모든 데이터(타이머/TODO/메모/설정)를 삭제할까요?")) return;
      state = structuredClone(defaultState);
      localStorage.removeItem(STORAGE_KEY);
      beepToggle.checked = state.settings.beepEnabled;
      notifyToggle.checked = state.settings.notifyEnabled;
      memoInput.value = "";
      renderTimers();
      renderTodos();
    });

    exportBtn.addEventListener("click", async () => {
      const data = JSON.stringify(state, null, 2);
      try {
        await navigator.clipboard.writeText(data);
        alert("JSON을 클립보드에 복사했습니다.");
      } catch {
        prompt("아래 JSON을 복사하세요:", data);
      }
    });

    importBtn.addEventListener("click", () => {
      const text = prompt("이전에 내보낸 JSON을 붙여넣으세요.");
      if (!text) return;
      try {
        const obj = JSON.parse(text);
        if (!obj || typeof obj !== "object") throw new Error("invalid");
        state = {
          settings: {
            beepEnabled: !!obj?.settings?.beepEnabled,
            notifyEnabled: !!obj?.settings?.notifyEnabled,
          },
          timers: Array.isArray(obj?.timers) ? obj.timers : [],
          todos: Array.isArray(obj?.todos) ? obj.todos : [],
          memo: typeof obj?.memo === "string" ? obj.memo : "",
        };
        beepToggle.checked = state.settings.beepEnabled;
        notifyToggle.checked = state.settings.notifyEnabled;
        memoInput.value = state.memo;
        saveState();
        renderTimers();
        renderTodos();
        alert("가져오기 완료!");
      } catch {
        alert("가져오기 실패: JSON 형식이 올바르지 않습니다.");
      }
    });

    renderTimers();
    renderTodos();
    setInterval(tickAll, 200);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        for (const t of state.timers) tickOne(t);
        saveState();
        renderTimers();
      }
    });
  </script>
</body>
</html>
